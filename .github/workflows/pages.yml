name: Download page

on:
  push:
    branches: [main]
    paths: ['apps/landing/**', 'scripts/release/**', '.github/workflows/pages.yml']
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the page with the current releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -w @rdi/landing
      - name: Manifest from GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=100" | node scripts/release/manifest.mjs --out apps/landing/src/data/releases.json
          gh api "repos/${{ github.repository }}" --jq '{url: .html_url, stars: .stargazers_count}' > apps/landing/src/data/repo.json
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build the site for its Pages URL
        env:
          ASTRO_SITE: ${{ steps.pages.outputs.origin }}
          ASTRO_BASE: ${{ steps.pages.outputs.base_path }}
        run: npm run build -w @rdi/landing
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/landing/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
